<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ChatDPT</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>

    <body class="bg-neutral-900 text-white overflow-x-hidden">
        <div class="container mx-auto max-w-3xl pb-44 px-2" id="chat-container">
            <!-- Messages goes here -->

            <!-- user message -->

            <!-- Assistant message -->

            <!-- Bottom textarea goes here -->

            <div class="fixed inset-x-0 bottom-0 flex items-center justify-center p-4 bg-transparent">
                <div class="relative w-full max-w-3xl bg-neutral-800 border border-neutral-700 shadow-2xl rounded-3xl p-1.5 focus-within:ring-2 focus-within:ring-blue-500/50 transition-all">
                    <textarea 
                        placeholder="Ask me anything..." 
                        aria-label="input" 
                        class="w-full bg-transparent text-white placeholder-neutral-500 resize-none outline-none p-3 max-h-40 overflow-y-auto caret-white" 
                        rows="1" 
                        id="input"
                    ></textarea>

                    <div class="flex items-center justify-between px-2 pb-1">
                        <!-- Optional: Add helper icons here (attachment, voice, etc.) -->
                        <div class="flex gap-2"></div>

                        <button
                            id="ask"
                            class="bg-blue-400 hover:bg-blue-500 text-white font-medium px-5 py-2 rounded-2xl transition-colors duration-200 shadow-lg active:scale-95"
                        >
                            Ask
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <script src="./script.js"></script>
    </body>
</html>
